<svg fill="none" viewBox="0 0 920 54" width="920" height="54" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          height: 54px;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .bar {
          width: 100%;
          height: 2px;
          border-radius: 999px;
          background: linear-gradient(90deg, transparent 0%, rgba(139, 92, 246, 0.2) 20%, #7c3aed 50%, rgba(139, 92, 246, 0.2) 80%, transparent 100%);
          box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }
        .diamond {
          position: absolute;
          width: 9px;
          height: 9px;
          background: #8b5cf6;
          border: 1.5px solid #ffffff;
          transform: rotate(45deg);
          box-shadow: 0 0 12px #a78bfa;
          animation: pulseGem 3s ease-in-out infinite;
        }
        @keyframes pulseGem {
          0%, 100% { transform: rotate(45deg) scale(1); background: #7c3aed; }
          50%      { transform: rotate(45deg) scale(1.25); background: #c4b5fd; }
        }
      </style>
      <div class="wrap">
        <div class="bar"></div>
        <div class="diamond"></div>
      </div>
    </div>
  </foreignObject>
</svg>