<svg fill="none" viewBox="0 0 900 28" width="900" height="28" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrap {
          height: 28px;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .bar {
          width: 100%;
          height: 3px;
          border-radius: 999px;
          background: linear-gradient(90deg, #0f172a 0%, #161324 20%, #632cd6 50%, #8b5cf6 75%, #7c3aed 90%, #0f172a 100%);
          background-size: 250% 100%;
          animation: flowGradient 5s linear infinite;
          box-shadow: 0 0 12px rgba(139, 92, 246, 0.55);
        }
        .diamond {
          position: absolute;
          width: 10px;
          height: 10px;
          background: #8b5cf6;
          border: 2px solid #f3e8ff;
          transform: rotate(45deg);
          box-shadow: 0 0 10px #7c3aed;
          animation: pulseGem 2.5s ease-in-out infinite;
        }
        @keyframes flowGradient {
          0%   { background-position: 0% 50%; }
          100% { background-position: 250% 50%; }
        }
        @keyframes pulseGem {
          0%, 100% { transform: rotate(45deg) scale(1); background: #632cd6; }
          50%      { transform: rotate(45deg) scale(1.3); background: #c4b5fd; }
        }
      </style>
      <div class="wrap">
        <div class="bar"></div>
        <div class="diamond"></div>
      </div>
    </div>
  </foreignObject>
</svg>
