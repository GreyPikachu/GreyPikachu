<svg fill="none" viewBox="0 0 900 210" width="900" height="210" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .banner-wrap {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
          height: 206px;
          border-radius: 18px;
          position: relative;
          overflow: hidden;
          border: 1px solid rgba(139, 92, 246, 0.45);
          box-shadow: 0 12px 35px rgba(15, 23, 42, 0.7), inset 0 0 30px rgba(139, 92, 246, 0.2);
          /* Базовый градиент #1 пользователя */
          background: linear-gradient(135deg, #161324 0%, #632cd6 50%, #8b5cf6 100%);
        }

        /* Второй градиент пользователя, плавно переливающийся поверх первого */
        .gradient-layer-2 {
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, #0f172a 0%, #7c3aed 100%);
          animation: morphGradients 7s ease-in-out infinite alternate;
          z-index: 1;
        }

        /* Мягкое неоновое пятно, плавающее по диагонали */
        .glow-orb {
          position: absolute;
          width: 340px;
          height: 340px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(139, 92, 246, 0.45) 0%, rgba(99, 44, 214, 0) 70%);
          top: -120px;
          right: -60px;
          animation: floatOrb 9s ease-in-out infinite alternate;
          z-index: 2;
        }

        /* Тонкая кибер-сетка поверх градиентов */
        .mesh {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
          background-size: 32px 32px;
          z-index: 2;
        }

        .content {
          position: relative;
          z-index: 3;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 20px;
        }

        .badge-top {
          font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
          font-size: 11.5px;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: #e9d5ff;
          background: rgba(15, 23, 42, 0.55);
          border: 1px solid rgba(167, 139, 250, 0.45);
          padding: 4px 14px;
          border-radius: 999px;
          margin-bottom: 12px;
          backdrop-filter: blur(6px);
        }

        .title {
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -0.5px;
          color: #ffffff;
          text-shadow: 0 4px 24px rgba(15, 23, 42, 0.65);
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .bolt {
          display: inline-block;
          filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
          animation: pulseBolt 2.5s ease-in-out infinite;
        }

        .subtitle {
          margin-top: 10px;
          font-size: 16px;
          font-weight: 500;
          color: #f3e8ff;
          letter-spacing: 0.3px;
          text-shadow: 0 2px 10px rgba(15, 23, 42, 0.5);
        }

        .subtitle span.sep {
          color: #c4b5fd;
          margin: 0 8px;
        }

        /* Декоративная волна внизу */
        .bottom-wave {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 6px;
          background: linear-gradient(90deg, #161324, #8b5cf6, #c4b5fd, #632cd6, #0f172a);
          background-size: 300% 100%;
          animation: waveSlide 5s linear infinite;
          z-index: 4;
        }

        @keyframes morphGradients {
          0%   { opacity: 0; }
          100% { opacity: 1; }
        }
        @keyframes floatOrb {
          0%   { transform: translate(0, 0) scale(1); }
          100% { transform: translate(-180px, 50px) scale(1.25); }
        }
        @keyframes pulseBolt {
          0%, 100% { transform: scale(1) rotate(0deg); }
          50%      { transform: scale(1.16) rotate(6deg); }
        }
        @keyframes waveSlide {
          0%   { background-position: 0% 50%; }
          100% { background-position: 300% 50%; }
        }
      </style>

      <div class="banner-wrap">
        <div class="gradient-layer-2"></div>
        <div class="glow-orb"></div>
        <div class="mesh"></div>

        <div class="content">
          <div class="badge-top">100% On-Device • Zero-Cloud • Native Systems</div>
          <div class="title">
            GreyPikachu <span class="bolt">⚡</span>
          </div>
          <div class="subtitle">
            Local-First AI <span class="sep">•</span> Native macOS &amp; Android <span class="sep">•</span> P2P Networks &amp; C++20
          </div>
        </div>

        <div class="bottom-wave"></div>
      </div>
    </div>
  </foreignObject>
</svg>
