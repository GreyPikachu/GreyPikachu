<svg fill="none" viewBox="0 0 920 70" width="920" height="70" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .footer-wrap {
          height: 66px;
          border-radius: 14px;
          position: relative;
          overflow: hidden;
          background: linear-gradient(135deg, #161324 0%, #632cd6 50%, #8b5cf6 100%);
          border: 1px solid rgba(139, 92, 246, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #f3e8ff;
          font-size: 13.5px;
          letter-spacing: 0.5px;
        }
        .layer2 {
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, #0f172a 0%, #7c3aed 100%);
          animation: morphFooter 7s ease-in-out infinite alternate;
          z-index: 1;
        }
        .pill {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          gap: 12px;
          background: rgba(15, 23, 42, 0.55);
          padding: 7px 22px;
          border-radius: 999px;
          border: 1px solid rgba(196, 181, 253, 0.35);
          backdrop-filter: blur(8px);
        }
        .dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #c084fc;
          box-shadow: 0 0 10px #c084fc;
          animation: pulse 2.5s infinite;
        }
        @keyframes morphFooter {
          0%   { opacity: 0; }
          100% { opacity: 1; }
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50%      { transform: scale(1.3); opacity: 1; }
        }
      </style>
      <div class="footer-wrap">
        <div class="layer2"></div>
        <div class="pill">
          <span class="dot"></span>
          <span>GreyPikachu • Создаю вещи с душой, автономностью и вниманием к деталям</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>